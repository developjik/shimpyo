<!doctype html>
<html lang="ko" data-seed data-seed-color-mode="system" data-seed-user-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>쉼표_ 몇억이면 쉴 수 있는가</title>
    <meta name="description" content="국민연금·건강보험료·세금을 통합한 한국형 FIRE 시뮬레이터. 모든 숫자에 출처를 공개합니다. 역사 백테스트 기반 성공확률." />
    <meta property="og:title" content="쉼표 — 몇억이면 쉴 수 있는가" />
    <meta property="og:description" content="계산기마다 답이 다르다? 근거를 전부 공개하는 한국형 FIRE 시뮬레이터." />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
        function applySeedScheme() {
          document.documentElement.dataset.seedUserColorScheme = prefersDark.matches ? "dark" : "light";
        }
        if ("addEventListener" in prefersDark) prefersDark.addEventListener("change", applySeedScheme);
        else if ("addListener" in prefersDark) prefersDark.addListener(applySeedScheme);
        var saved = null;
        try { saved = localStorage.getItem("shimpyo.theme"); } catch (e) {}
        if (saved === "dark" || saved === "light") {
          document.documentElement.dataset.seedColorMode = saved === "dark" ? "dark-only" : "light-only";
        } else {
          applySeedScheme();
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
