name: monthly-data-update

# ECOS 월간 갱신 + 골든 케이스 회귀 테스트 + 데이터 만료 배지
# 실패 시 배포되지 않는다 (죽음 테스트의 기계 부분)

on:
  schedule:
    - cron: "0 21 5 * *"   # 매월 5일 06:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ECOS data (skip if no key yet)
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: |
          if [ -z "$ECOS_KEY" ]; then
            echo "ECOS_KEY 미등록 — 데이터 수집 생략 (골든 케이스만 실행). repo Settings → Secrets → Actions에 ECOS_KEY 등록 시 자동 활성화."
            mkdir -p data && echo '{"note":"ECOS key not set yet"}' > data/ecos_snapshot.json
          else
            python3 scripts/ecos_update.py --key "$ECOS_KEY" --out data/
          fi

      - name: Golden case regression (fail = block deploy)
        run: |
          node scripts/golden_runner.mjs

      - name: Update data freshness
        run: |
          npx tsx scripts/update_freshness.mjs

      - name: Build (verify app compiles with new data)
        run: |
          npm ci || npm install --no-audit --no-fund
          npx vite build

      - name: Commit if changed
        run: |
          git config user.name "shimpyo-bot"
          git config user.email "bot@shimpyo.local"
          git add -A
          git diff --cached --quiet || git commit -m "data: monthly ECOS update + golden regression $(date +%Y-%m-%d)"
          git push
