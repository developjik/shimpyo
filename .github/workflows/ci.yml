name: ci

# 푸시/PR마다 골든 케이스 + 프로덕션 빌드 검증
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  golden-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Golden case regression (fail = block)
        run: npm run golden
      - name: Production build
        run: npm run build
