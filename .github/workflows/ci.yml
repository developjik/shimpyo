name: ci

# 푸시/PR마다 골든 케이스 회귀 테스트 — FAIL이면 빨간 X. 배포 차단의 첫 관문.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Golden case regression
        run: node scripts/golden_runner.mjs
